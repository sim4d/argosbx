name: Build and Push Docker Image 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Ensure Dockerfile exists
        run: |
          test -f container/nodejs/Dockerfile || { echo "Dockerfile not found at container/nodejs/Dockerfile"; exit 1; }

      - name: Normalize owner to lowercase
        id: repo_owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./container/nodejs
          file: ./container/nodejs/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.value }}/myargosbx:2026
